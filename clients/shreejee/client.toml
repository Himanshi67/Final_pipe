# Shree Jee Electronics - the first client. See docs/CLIENT_CONFIG.md.
# Every value here was a hard-coded literal in app.py / build_csv.py /
# validate_csv.py before Phase 1 item 1; they are copied verbatim, so the
# output for this client is byte-identical to what the pipeline produced
# before the config existed.

[client]
slug = "shreejee"                       # must equal the directory name
name = "Shree Jee Electronics"          # human label (GUI titles, reports)

[store]
url = "https://shreejeeelectronics.in"  # no trailing slash
media_base = "{url}/wp-content/uploads/{yyyy}/{mm}"
seo_site_name = "Shree Jee Electronics"
placeholder_html = "<p>Premium product available at Shree Jee Electronics. Detailed specifications currently updating.</p>"

[taxonomy]
category_map = "category_map.xlsx"
category_seo = "category_seo.xlsx"
attributes_master = "SubCategory_Attributes_Master.xlsx"

# One table replaces app.SKU_PREFIX_BY_PARENT / SKU_PREFIXES /
# SKU_PREFIX_CATEGORY, validate_csv.SKU_PREFIX_RE, gui_helpers.SKU_CODES and
# sku_enricher.CATEGORY_CODES, which used to drift independently.
# (Sub-tables, not inline tables: TOML forbids a newline inside { }.)
[sku]
fallback_prefix = "AP"           # anything with no parent match
never_rename = ["WM", "WH"]      # live products carry these - prefixed_sku returns them untouched
strip_codes = ["DW", "LED", "MW"]  # extra tokens the enricher strips, no taxonomy hint

# OUTPUT side: the canonical code emitted per taxonomy parent when building the
# WooCommerce SKU. Order matters - it is the order of SkuScheme.prefixes.
[sku.prefix_by_parent]
"Washing Machines" = "WM"
"Water Heaters" = "WH"
"LED" = "TV"
"Air Conditioner" = "AC"
"Cooling & Freezing" = "CF"
"Kitchen Appliances" = "KA"
"Home Appliances" = "HA"
"Small Appliances" = "SA"
"Electronics & Computing" = "EC"

# INPUT side: codes an operator/ERP writes at the front of a raw SKU ->
# taxonomy hint [parent, sub].
[sku.input_codes]
WM = ["Washing Machines", ""]
WH = ["Water Heaters", "Geysers"]
SM = ["Home Appliances", "sewing machine"]
HWD = ["Home Appliances", "Water Dispensers"]
REF = ["Home Appliances", "Refrigerators"]
FRIDGE = ["Home Appliances", "Refrigerators"]
MWO = ["Kitchen Appliances", "Microwave Ovens"]
IC = ["Kitchen Appliances", "Induction Cooktops"]
ICT = ["Kitchen Appliances", "Induction Cooktops"]
DI = ["Small Appliances", "Electric Iron"]
DF = ["Cooling & Freezing", "Deep Freezers"]
AC = ["Air Conditioner", ""]
TV = ["LED", ""]

# How the build output states the price (owner decision, 2026-11-19):
# single_price = true writes ONE price: 'regular price' = the higher of the
# MRP and the selling price, 'sale price' = empty, and no "save" / "% off"
# text. _filled.xlsx still records both values. Code default: false.
[pricing]
single_price = true

[serper]
api_key_env = "SERPER_API_KEY"   # BYOK: the env var (in the client's .env) that holds the key
monthly_budget = 2500            # informational (free tier); the GUI shows month-to-date against it
default_run_budget = 0           # 0 = unlimited; the GUI pre-fills --budget with it
# "incremental" (default): a tier's uncached queries go out one at a time and
# stop once a complete listing is verified. "batch": every query of a tier
# goes out before any page is checked (the pre-2026-11-19 behaviour, more
# credits). Owner set "incremental" on 2026-11-19; go back to "batch" if more
# rows end NOT FOUND.
query_mode = "incremental"
# "paid_first" (default): serper.dev, DuckDuckGo only when serper fails.
# "free_first": DuckDuckGo first, serper only when DuckDuckGo gives nothing.
# The --search-order flag overrides this for one run.
search_order = "paid_first"

# Tier 0 of the URL search (url_index.py): the local sitemap index and the
# retailers' own search, tried BEFORE any paid serper.dev search. Shared
# sources live in url_sources.toml; see docs/CLIENT_CONFIG.md.
[url_index]
enabled = true                   # false = straight to serper/DuckDuckGo, as before
max_age_days = 7                 # sources older than this refresh at enricher start
disable = []                     # source / site-search names to switch off for this client
# extra sources for this client only, same keys as [[source]] in url_sources.toml:
# [[url_index.extra_sources]]
# name = "mydealer"
# root = "https://www.example.com/sitemap.xml"
# url_pattern = '/product/'
