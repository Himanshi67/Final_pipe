# url_sources.toml - tier 0 of the URL search (url_index.py).
#
# [[source]]       a sitemap that feeds the local URL index (url_index\index.sqlite)
#   name           unique id (also what clients\<slug>\client.toml [url_index] disable names)
#   root           root sitemap URL. '' = use the Sitemap: lines of robots.txt
#   domain         defaults to the root's host
#   child_pattern  regex: sitemap-index children to follow ('' = all)
#   child_exclude  regex: children never followed
#   url_pattern    regex: product URLs to keep ('' = all)
#   exclude_pattern regex: URLs to drop
#   brand          set on a brand's OWN site: short model codes then match there
#                  without the brand in the slug
#   enabled        false = never refreshed, never looked up
#
# [[site_search]]  a retailer's own search endpoint (asked only when the index
#                  verified nothing for the row)
#   url_template   '{q}' is replaced by the URL-encoded model code
#   extract        json | regex | css
#   items / url_field / url_prefix / name_field / model_field   (json)
#   pattern (named groups url, title)                           (regex)
#   selector / attr                                             (css)
#
# Live check of every entry: 2026-11-19. "codes in slug" = share of product
# URLs whose slug carries the retail model code.

# ---------------------------------------------------------------- enabled
[[source]]
name = "lg"                      # flat urlset, ~1,800 products, 96% codes in slug
root = "https://www.lg.com/in/sitemap.xml"
url_pattern = '^https://www\.lg\.com/in/[^/?#]+/[^/?#]+/[^/?#]+/?$'
exclude_pattern = '/in/(?:support|business|lg-experience|about-lg|promotions?|offers?|search|my-lg|brand|campaign|stories|magazine)/'
brand = "lg"
enabled = true

[[source]]
name = "bosch"                   # 2,027 URLs, 95%, code UPPERCASE exact
root = "https://www.bosch-home.in/sitemap.xml"
child_exclude = 'sherpa'         # do NOT use the sherpa-sitemap
url_pattern = '/en/product/'
brand = "bosch"
enabled = true

[[source]]
name = "voltasbeko"              # 198 product pages, 100%
root = "https://www.voltasbeko.com/sitemap.xml"
url_pattern = '\.html$'
brand = "voltas"
enabled = true

[[source]]
name = "samsung"                 # b2c -> da (appliances, 438) + vd (TV); 89%, code = last slug token
root = "https://www.samsung.com/in/sitemap.xml"
child_pattern = '(?:b2c|da|vd)-sitemap\.xml'   # skip im- (mobile)
url_pattern = '^https://www\.samsung\.com/in/'
brand = "samsung"
enabled = true

[[source]]
name = "haier"                   # 2,986 URLs, 86%. haierindia.com sits behind an AppTrana WAF (503) - not used
root = "https://www.haier.com/in/sitemap.xml"
url_pattern = '\.shtml$'
brand = "haier"
enabled = true

[[source]]
name = "godrej"                  # b2c-products only, 1,304 /p/ URLs, no lastmod
root = "https://www.godrejenterprises.com/sitemap.xml"
child_pattern = '/sitemap/b2c-products\.xml'
url_pattern = '/p/'
brand = "godrej"
enabled = true

[[source]]
name = "panasonic"               # 926, 74%. /in/sitemap.xml has an EMPTY body - use /in/en/
root = "https://www.panasonic.com/in/en/sitemap.xml"
url_pattern = '^https://www\.panasonic\.com/in/'
brand = "panasonic"
enabled = true

[[source]]
name = "poorvika"                # single urlset, 7,878, 76%
root = "https://www.poorvika.com/sitemap_product.xml"
url_pattern = '/p/?$'
enabled = true

[[source]]
name = "vijaysales"              # one products child, 6,035, 62%
root = "https://www.vijaysales.com/sitemap-index.xml"
child_pattern = 'products-sitemap\.xml'
url_pattern = '/p/'
enabled = true

[[source]]
name = "reliancedigital"         # /sitemap/products/{1..18}/page.sitemap.xml, ~9,000, 61%
root = "https://www.reliancedigital.in/sitemap.xml"
child_pattern = '/sitemap/products/'
url_pattern = '/product/'
enabled = true

