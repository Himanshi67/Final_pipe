# ------------------------------------------------------------ site search
# Order matters: reliance first, then croma.

[[site_search]]
name = "reliancedigital"         # zero items is a normal miss (codes Reliance does not stock)
url_template = "https://www.reliancedigital.in/ext/raven-api/catalog/v1.0/products?q={q}&page_size=12"
extract = "json"
items = "items"
url_field = "slug"
url_prefix = "https://www.reliancedigital.in/product/"
name_field = "name"
model_field = "attributes.model" # exact model field: accepted on equality, else code-in-name
enabled = true

[[site_search]]
name = "croma"                   # the ':relevance' suffix (%3Arelevance) is REQUIRED - 400 without it
url_template = "https://api.croma.com/searchservices/v1/search?currentPage=0&query={q}%3Arelevance&fields=FULL&channel=WEB&channelCode=400049&spellOpt=DEFAULT"
extract = "json"
items = "products"
url_field = "url"                # relative
url_prefix = "https://www.croma.com"
name_field = "name"              # model code sits in parentheses: "(GL-N292DDSY, Dazzle Steel)"
enabled = true

[[site_search]]
name = "flipkart"                # robots disallows /search?, and code results were wrong (ink for a washer)
url_template = "https://www.flipkart.com/search?q={q}"
extract = "regex"
pattern = 'href="(?P<url>/[^"]+/p/[^"]+)"'
url_prefix = "https://www.flipkart.com"
enabled = false

[[site_search]]
# Third and last fallback (owner decision, 2026-11-19). Results come from the
# Unbxd API the search-listing page calls in the browser. Its keys sit in the
# page's hidden inputs: they are read at run time, once per run, kept in memory
# only - never hardcoded here, never cached, logged or reported.
# DISABLED: the endpoint below is INFERRED and has not been confirmed live.
# The live probe (one page fetch + one search) was refused by the agent's
# permission system on 2026-11-19, so the response shape is unverified. The
# fields are best guesses with fallbacks ('a|b' = first non-empty). Confirm
# with one manual run, then set enabled = true.
name = "vijaysales"
key_page = "https://www.vijaysales.com/search-listing?q=tv"
key_inputs = ["unbxd-apiKey", "unbxd-siteKey"]
url_template = "https://search.unbxd.io/{key:unbxd-apiKey}/{key:unbxd-siteKey}/search?q={q}&rows=12&format=json"
extract = "json"
items = "response.products"
url_field = "productUrl|url|uniqueId"
url_prefix = "https://www.vijaysales.com/"
url_must_match = '^https://www\.vijaysales\.com/(?:.+/)?p/'   # only real /p/ product pages
name_field = "title|name"
model_field = "modelNumber|model|sku"
enabled = false

# tatacliq: no usable endpoint.
