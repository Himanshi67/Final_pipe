<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Shree Jee catalog pipeline - data flow</title>
  <desc id="d">SKU list to sku_enricher to filled Excel with manual review, then app.py produces the WooCommerce CSV and WebP images, validate_csv checks quality, then images and CSV are imported to WordPress.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f4fb; stroke: #5a50e0; stroke-width: 1.6; }
    .youbox { fill: #fff7e8; stroke: #d99a1b; stroke-width: 1.4; }
    .h { font: 600 15px system-ui, Segoe UI, sans-serif; fill: #1f1f28; }
    .s { font: 400 12px system-ui, Segoe UI, sans-serif; fill: #62626e; }
    .cap { font: 700 11px system-ui, Segoe UI, sans-serif; fill: #8a8a96; letter-spacing: 1.5px; }
    .file { font: 600 12px Consolas, monospace; fill: #5a50e0; }
    .arrow { stroke: #5a50e0; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#5a50e0" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="620" class="bg"/>
  <text x="40" y="36" class="cap">SHREE JEE CATALOG PIPELINE — DATA FLOW</text>

  <rect x="40" y="54" width="420" height="56" rx="10" class="box"/>
  <text x="60" y="78" class="h">SKU list</text>
  <text x="60" y="98" class="s">Excel/CSV with a 'sku' column, placed in final_pipe\</text>
  <text x="480" y="88" class="file">WM MODEL LIST.xlsx</text>
  <path d="M 250 110 L 250 136" class="arrow" marker-end="url(#ah)"/>

  <rect x="40" y="138" width="420" height="66" rx="10" class="box"/>
  <text x="60" y="162" class="h">1 · sku_enricher.py</text>
  <text x="60" y="181" class="s">searches Amazon.in / Flipkart / Croma / brand store /</text>
  <text x="60" y="196" class="s">Reliance; strict model-code + capacity verification</text>
  <text x="480" y="176" class="file">_filled.xlsx</text>
  <path d="M 250 204 L 250 230" class="arrow" marker-end="url(#ah)"/>

  <rect x="40" y="232" width="420" height="52" rx="10" class="youbox"/>
  <text x="60" y="254" class="h">YOU · review flagged rows</text>
  <text x="60" y="272" class="s">CHECK MANUALLY / CLOSE MATCH / NOT FOUND / few images</text>
  <path d="M 250 284 L 250 310" class="arrow" marker-end="url(#ah)"/>

  <rect x="40" y="312" width="420" height="66" rx="10" class="box"/>
  <text x="60" y="336" class="h">2 · app.py  (Streamlit, in the browser)</text>
  <text x="60" y="355" class="s">FOUND rows only by default · categories · descriptions ·</text>
  <text x="60" y="370" class="s">SKU prefixes + dedupe · downloads images as WebP</text>
  <text x="480" y="340" class="file">wordpress_ready_..csv</text>
  <text x="480" y="358" class="file">product_images_for_upload\</text>
  <path d="M 250 378 L 250 404" class="arrow" marker-end="url(#ah)"/>

  <rect x="40" y="406" width="420" height="56" rx="10" class="box"/>
  <text x="60" y="430" class="h">3 · validate_csv.py</text>
  <text x="60" y="449" class="s">3+ images, files exist locally, dupes, prices, labels</text>
  <text x="480" y="440" class="file">validation_issues.csv</text>
  <path d="M 250 462 L 250 488" class="arrow" marker-end="url(#ah)"/>

  <rect x="40" y="490" width="420" height="52" rx="10" class="youbox"/>
  <text x="60" y="512" class="h">YOU · upload + import</text>
  <text x="60" y="530" class="s">WebP files to WordPress Media (same YYYY/MM) · CSV via WooCommerce</text>
  <path d="M 250 542 L 250 568" class="arrow" marker-end="url(#ah)"/>

  <rect x="40" y="570" width="420" height="40" rx="10" class="box"/>
  <text x="60" y="595" class="h">Live products — shreejeeelectronics.in</text>

  <rect x="510" y="470" width="12" height="12" rx="3" class="box"/>
  <text x="530" y="480" class="s">automated step</text>
  <rect x="510" y="492" width="12" height="12" rx="3" class="youbox"/>
  <text x="530" y="502" class="s">manual step (you)</text>
</svg>
